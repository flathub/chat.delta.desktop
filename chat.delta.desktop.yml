app-id: chat.delta.desktop
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
  - org.freedesktop.Sdk.Extension.rust-stable
command: run.sh
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --device=all # Webcam access for QR code scans and DRI for OpenGL
  - --socket=pulseaudio # Record and play voice messages
  # These xdg-* permissions are needed for two reasons: on old xdg-desktop-portal
  # versions (< 1.19.0) a backup export fails with: I/O error in the advisory file locking layer
  # see https://github.com/flatpak/xdg-desktop-portal/issues/1117
  # and drag-and-drop on X11 only works when a dropped file comes from an xdg granted path.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-music
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos
  - --share=network
  - --talk-name=org.freedesktop.Notifications # needed for dbus notification, as the notification portal crashed because of a bug in electron https://github.com/electron/electron/issues/40461
  - --talk-name=com.canonical.AppMenu.Registrar # fix https://github.com/flathub/chat.delta.desktop/issues/118
  - --talk-name=org.kde.StatusNotifierWatcher # fix https://github.com/flathub/chat.delta.desktop/issues/143
  - --talk-name=com.canonical.Unity # D-Bus talk for Unity desktop
  - --system-talk-name=dummy.permission.to-suppress-chromium-error # see https://github.com/deltachat/deltachat-desktop/issues/5879
  - --env=NOTIFY_IGNORE_PORTAL=1 # fix https://github.com/deltachat/deltachat-desktop/issues/3590

cleanup:
  - /app/dc-core
  # Desktop___________________
  - /delta/resources/app/node_modules/napi-macros
  # frontend node_modules not needed at runtime - would get easier if dc-desktop would adopt the 2 package.json project structure
  # every react addon
  - /delta/resources/app/node_modules/react-*
  - /delta/resources/app/node_modules/classnames
  - /delta/resources/app/node_modules/use-debounce
  - /delta/resources/app/node_modules/create-react-context
  # need testing?
  - /delta/resources/app/node_modules/resize-observer-polyfill
  # momentjs is currently only used by renderer process
  - /delta/resources/app/node_modules/moment

modules:
  - name: deltachat-core-rust
    buildsystem: simple

    build-options:
      env:
        # Tell caches where we pre-downloaded things.
        npm_config_cache: /run/build/deltachat-core-rust/flatpak-node/npm-cache/

        # It does not work to dereference the variable here :-/
        # CARGO_HOME: $FLATPAK_BUILDER_BUILDDIR/cargo
        CARGO_HOME: /run/build/deltachat-core-rust/cargo

        # The intention is to have a release build with debugging symbols.
        # The flatpak build process should separate the debug symbols.
        RUSTFLAGS: "-g"

        # sccache hopefully speeds up subsequent compilations
        RUSTC_WRAPPER: /app/bin/sccache
        SCCACHE_DIR: /run/ccache/sccache/

      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin

    build-commands:
      - ls /run/build
      - ls
      - pwd
      - node --version
      - python3 --version
      - npm cache verify
      - cd deltachat-jsonrpc/typescript && env DEBUG="*" npm install --offline --verbose && npm run build
      - python3 deltachat-rpc-server/npm-package/scripts/make_local_dev_version.py
      # mkdir only dc-core (not dc-core/deltachat-jsonrpc): the cp below must
      # create that dir itself, else `cp -r` nests it one level too deep.
      - mkdir -p /app/dc-core
      - sed -i 's|/run/build/deltachat-core-rust|/app/dc-core/deltachat-rpc-server|g' deltachat-rpc-server/npm-package/package.json
      - cp -r deltachat-jsonrpc /app/dc-core/deltachat-jsonrpc
      - cp -r deltachat-rpc-server /app/dc-core/deltachat-rpc-server

    modules:
      # setup caching
      - name: sccache
        buildsystem: simple
        build-commands:
          - install -Dma+rwx sccache /app/bin/sccache
        cleanup:
          - /bin/sccache
        sources:
          - type: archive
            url: https://github.com/mozilla/sccache/releases/download/v0.2.15/sccache-v0.2.15-x86_64-unknown-linux-musl.tar.gz
            sha256: e5d03a9aa3b9fac7e490391bbe22d4f42c840d31ef9eaf127a03101930cbb7ca
            only-arches: ["x86_64"]

          - type: archive
            url: https://github.com/mozilla/sccache/releases/download/v0.2.15/sccache-v0.2.15-aarch64-unknown-linux-musl.tar.gz
            sha256: 90d91d21a767e3f558196dbd52395f6475c08de5c4951a4c8049575fa6894489
            only-arches: ["aarch64"]

    sources:
      - generated/core-git.json
      - generated/sources-rust.json
      - generated/sources-jsonrpc-client-npm.json

      - type: file
        path: generated/deltachat-jsonrpc.typescript.package-lock.json
        dest: deltachat-jsonrpc/typescript/
        dest-filename: package-lock.json

  - name: delta
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin:/run/build/delta/pnpm/bin
      env:
        NPM_CONFIG_LOGLEVEL: info

        # pnpm 11's supply-chain check (minimumReleaseAge, default 1440) re-verifies
        # every lockfile entry against the registry on install, and --offline does
        # NOT suppress it (pnpm#11801) - so mark it trusted
        PNPM_CONFIG_TRUST_LOCKFILE: "true"

        XDG_CACHE_HOME: /run/build/delta/flatpak-node/cache
        TMPDIR: /run/build/delta/flatpak-node/tmp

        # This overwrites the git-ref version info for the about- and crash-screen
        VERSION_INFO_GIT_REF: "flathub"
        NO_ASAR: "true"

        # electron / electron-builder look here for the prebuilt electron zip.
        # flatpak-node-generator populates it under $XDG_CACHE_HOME/electron.
        ELECTRON_CONFIG_CACHE: /run/build/delta/flatpak-node/cache/electron
        electron_config_cache: /run/build/delta/flatpak-node/cache/electron
        ELECTRON_CACHE: /run/build/delta/flatpak-node/cache/electron

    build-commands:
      # fixup manually installed pnpm package (why manual? because global npm install is not possible because global node modules dir is read-only)
      # the pnpm tarball ships bin/pnpm.cjs as 0644, so restore the execute bit after renaming
      - mv ../pnpm/bin/pnpm.cjs ../pnpm/bin/pnpm
      - chmod +x ../pnpm/bin/pnpm
      - mkdir -p $TMPDIR
      - node --version
      - pnpm --version
      - python3 --version
      # Build the offline pnpm store from the tarballs flatpak-node-generator
      # fetched, and set up node-gyp headers. Both are run here (not as generated
      # source-phase shell steps) so the node SDK is on PATH and paths resolve
      # against the module build-dir root. (../ from main/ == build-dir root.)
      - (cd .. && python3 flatpak-node/populate_pnpm_store.py flatpak-node/pnpm-manifest.json flatpak-node/pnpm-tarballs flatpak-node/pnpm-store)
      - (cd .. && bash flatpak-node/setup_sdk_node_headers.sh)
      # point pnpm at the offline store (pnpm 11 reads storeDir from pnpm-workspace.yaml, not .npmrc)
      - 'echo "storeDir: /run/build/delta/flatpak-node/pnpm-store" >> pnpm-workspace.yaml'
      # Use the locally-built (from-source) core instead of the prebuilt npm
      # binaries. generate.sh already linked it into the lockfile via `link:`;
      # here we recreate the symlink at the path the lockfile expects
      # (../../../deltachat-core-rust from packages/*) and reapply the linked
      # lockfile + package.json manifests over the pristine checkout, so the
      # single offline frozen install below wires in the local core. (pnpm add
      # cannot run in the sandbox: it re-resolves and needs network metadata.)
      - ln -s /app/dc-core ../deltachat-core-rust
      # --no-same-owner: the tarball records the maintainer's uid/gid; inside the
      # build sandbox tar runs as (sandbox) root and would try to restore that
      # ownership, which the uid namespace cannot map ("Cannot change ownership").
      - tar xzf ../linked-core-overrides.tar.gz --no-same-owner
      # install deps fully offline from the store
      - pnpm install --offline --frozen-lockfile
      - mkdir -p /app/delta

      # build & package dc desktop
      - pnpm --filter @deltachat-desktop/target-electron build4production
      - pnpm --filter @deltachat-desktop/target-electron pack:generate_config
      - pnpm --filter @deltachat-desktop/target-electron pack:patch-node-modules
      # Point electron-builder at the electron zip flatpak-node-generator cached
      # (flatpak-node/cache/electron/electron-v<ver>-linux-<arch>.zip) via
      # electronDist, so it extracts that instead of trying to download electron
      # from github (its bundled @electron/get re-verifies checksums against a
      # github-fetched SHASUMS even on a cache hit, which fails offline).
      - pnpm --filter @deltachat-desktop/target-electron exec electron-builder --config ./electron-builder.json5 --linux --dir -c.electronDist=/run/build/delta/flatpak-node/cache/electron

      # The x86-64 build seems to be put in "linux-unpacked",
      # the aarch64 build in "linux-arm64-unpacked"
      # we try to catch both paths with the wildcard
      - cp -ar packages/target-electron/dist/linux*unpacked/* /app/delta/

      # The from-source stdio-rpc-server ships its binary under
      # platform_package/<rust-target>/ instead of as an installed
      # @deltachat/stdio-rpc-server-<os>-<arch> npm package. The desktop resolves
      # the server via require.resolve() (its env-var override is disabled unless
      # --allow-unsafe-core-replacement), so materialize that package where node
      # resolution expects it: node_modules/@deltachat/stdio-rpc-server-<os>-<arch>
      # (its package.json main is the binary, so resolve() returns the exe path).
      - |
        set -e
        NM=/app/delta/resources/app/node_modules
        SRC=$(ls -d "$NM/@deltachat/stdio-rpc-server/platform_package/"*)
        DEST="$NM/@deltachat/stdio-rpc-server-linux-$(node -e 'process.stdout.write(process.arch)')"
        cp -a "$SRC" "$DEST"

      # Install the required static files
      - install ../run.sh $FLATPAK_DEST/bin/run.sh
      - install -Dm 0644 ../chat.delta.desktop.desktop  /app/share/applications/chat.delta.desktop.desktop
      - install -Dm 0644 ../mime/deltachat-desktop.xml  /app/share/mime/packages/chat.delta.desktop.xml
      - install -Dm 0644 ../chat.delta.desktop.appdata.xml  /app/share/metainfo/chat.delta.desktop.appdata.xml
      - install -Dm 0644 ../delta-v7-pathed.svg /app/share/icons/hicolor/scalable/apps/chat.delta.desktop.svg
    subdir: main
    sources:
      # Electron
      # the binaries are already included in the pnpm store

      # Delta Chat
      - generated/desktop-git.json

      - type: file
        url: https://raw.githubusercontent.com/deltachat/interface/970c5df39866695b5e8ebdd73caa68cbb6de5242/icons/delta-v7-pathed.svg
        sha256: 1787a9dfdd80301ae5dbe48105bd58215c6552bd8ecfa4efd15fe6d31ba31274
        dest-filename: delta-v7-pathed.svg

      - type: file
        path: chat.delta.desktop.desktop

      - type: file
        path: chat.delta.desktop.256.png
        dest-filename: chat.delta.desktop.png

      - type: script
        dest-filename: run.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec zypak-wrapper /app/delta/deltachat-desktop "$@"

      # dependencies: offline pnpm store + electron/esbuild/playwright/node-gyp
      # caches, all produced by flatpak-node-generator from pnpm-lock.yaml
      - generated/pnpm-sources.json
      # pnpm binary itself (not provided by flatpak-node-generator)
      - generated/pnpm.json
      # linked lockfile + package.json manifests (from-source core), reapplied
      # over the checkout in build-commands. type:file so it is not auto-extracted.
      - type: file
        path: generated/linked-core-overrides.tar.gz

      # https://github.com/deltachat/deltachat-desktop/pull/1125
      - type: file
        path: chat.delta.desktop.appdata.xml

      - type: file
        path: mime/deltachat-desktop.xml
        dest: mime
